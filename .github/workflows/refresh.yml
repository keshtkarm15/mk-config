name: Refresh configurations

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      retention_limit:
        description: Maximum number of configurations to retain
        required: false
        default: "40"
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      RETENTION_LIMIT: ${{ inputs.retention_limit || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - name: Collect safe metadata
        run: mkconfig refresh --sources sources.example.json --limit "$RETENTION_LIMIT" --output docs/subscription.txt
      - name: Publish updated subscription
        run: |
          if ! git diff --quiet -- docs/subscription.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/subscription.txt
            git commit -m "Refresh published v2rayNG subscription"
            git push origin HEAD:main
          fi
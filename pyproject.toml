[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkconfig"
version = "0.1.0"
description = "Safe metadata collector and ranker for proxy configuration subscriptions"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mkconfig = "mkconfig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"